services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - backend_data:/app/backend/data
    restart: unless-stopped
    networks:
      - internal

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal
      - global-web

volumes:
  backend_data:

networks:
  internal:
  global-web:
    external: true