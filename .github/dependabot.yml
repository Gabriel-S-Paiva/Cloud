version: 2
updates:
  # Backend Go modules
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Frontend npm/pnpm packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "svelte*"
          - "@sveltejs/*"

  # Dockerfiles (backend + frontend/Caddy images)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # GitHub Actions workflow itself
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"